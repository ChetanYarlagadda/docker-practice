name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-west1-docker.pkg.dev/hello-devops-514902/hello-repo/hello-app:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: docker build -t $IMAGE .
      - name: Auth to GCP (WIF)
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/836041594773/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@hello-devops-514902.iam.gserviceaccount.com
      - name: Push image
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker push $IMAGE
      - name: Deploy to Cloud Run
        if: github.event_name == 'push'
        run: gcloud run deploy hello-app --image $IMAGE --region us-west1